<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDA Retro Desktop</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div id="pda-retro-desktop-1" aria-label="Retro detective desktop simulation">
  <div class="desktop-area" id="desktop-area">
    <div class="desktop-icons">
      <button class="desktop-icon" type="button" data-open="computer"><span class="icon-img">💻</span><span>My Computer</span></button>
      <button class="desktop-icon" type="button" data-open="cases"><span class="icon-img">📁</span><span>Case Files</span></button>
      <button class="desktop-icon" type="button" data-open="notepad"><span class="icon-img">📝</span><span>Notepad</span></button>
      <button class="desktop-icon" type="button" data-open="calculator"><span class="icon-img">🧮</span><span>Calculator</span></button>
      <button class="desktop-icon" type="button" data-open="mail"><span class="icon-img">📧</span><span>Mail</span></button>
      <button class="desktop-icon" type="button" data-open="recycle"><span class="icon-img">🗑️</span><span>Recycle Bin</span></button>
    </div>
  </div>

  <div class="start-menu" id="start-menu">
    <div class="start-content">
      <div class="start-head">PDA DESK</div>
      <div class="start-links">
        <button class="start-link" data-open="computer"><span>💻</span>My Computer</button>
        <button class="start-link" data-open="cases"><span>📁</span>Case Files</button>
        <button class="start-link" data-open="notepad"><span>📝</span>Notepad</button>
        <button class="start-link" data-open="calculator"><span>🧮</span>Calculator</button>
        <button class="start-link" data-open="mail"><span>📧</span>Mail</button>
        <hr class="start-divider">
        <button class="start-link" id="about-btn"><span>ℹ️</span>About this computer</button>
        <button class="start-link" id="shutdown-btn"><span>⏻</span>Shut Down...</button>
      </div>
    </div>
  </div>

  <div class="context-menu" id="context-menu">
    <button class="ctx-btn" id="ctx-refresh">Refresh</button>
    <button class="ctx-btn" id="ctx-new">New Folder</button>
    <button class="ctx-btn" id="ctx-about">Properties</button>
  </div>

  <div class="taskbar">
    <button class="retro-btn start" id="start-btn"><span class="start-logo">▣</span> Start</button>
    <div class="task-buttons" id="task-buttons"></div>
    <button class="retro-btn lang-btn" id="task-lang-btn" type="button" title="Switch Language / تغيير اللغة">عربي</button>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="noise"></div>
</div>
</body>
</html>
