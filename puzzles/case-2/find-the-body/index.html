                    "في صندوق السيارة الزرقاء", "في السيارة", "داخل السيارة", "في صندوق السيارة"
                ],
                hints: [
                    "Check the wording of your answer.",
                    "Focus on the eagle in the room; it might be the hint left by Ivan.",
                    "Look for a hidden place a criminal might choose to hide a body.",
                    "You've seen an eagle before, remember where... it might point to the body's location."
                ]
            }
        ]
    };

    const ui = uiTranslations[currentLang];
    const questions = questionsData[currentLang];

    // Static DOM Bindings
    document.getElementById('page-title').innerText = ui.pageTitle;
    document.getElementById('answer-input').placeholder = ui.placeholder;
    document.getElementById('submit-btn').innerText = ui.submitBtn;
    document.getElementById('hint-btn').innerText = ui.hintBtn;
    document.getElementById('show-answer-btn').innerText = ui.showAnswerBtn;
    document.getElementById('nqp-badge').innerText = ui.nqpBadge;
    document.getElementById('nqp-title').innerHTML = ui.nqpTitle;
    document.getElementById('nqp-subtitle').innerHTML = ui.nqpSubtitle;
    document.getElementById('nqp-btn').innerText = ui.nqpBtn;
    document.getElementById('success-title').innerText = ui.successTitle;
    document.getElementById('success-desc').innerText = ui.successDesc;
    document.getElementById('success-card-btn').innerText = ui.successBtn;

    // Element References
    const questionElement = document.getElementById('question');
    const answerInput = document.getElementById('answer-input');
    const submitBtn = document.getElementById('submit-btn');
    const feedbackElement = document.getElementById('feedback');
    const hintSection = document.getElementById('hint-section');
    const hintBtn = document.getElementById('hint-btn');
    const hintText = document.getElementById('hint-text');
    const showAnswerBtn = document.getElementById('show-answer-btn'); 
    const answerDisplay = document.getElementById('answer-display'); 
    const attemptsElement = document.getElementById('attempts');
    const successCard = document.getElementById('success-card');
    const successCardBtn = document.getElementById('success-card-btn');
    const quizContent = document.getElementById('quiz-content');

    let currentQuestionIndex = 0;
    let incorrectAttempts = 0;
    let currentHintIndex = 0;

    function loadQuestion(index) {
        const q = questions[index];
        questionElement.textContent = q.question;
        incorrectAttempts = 0;
        currentHintIndex = 0;
        answerInput.value = '';
        feedbackElement.className = 'feedback';
        feedbackElement.textContent = '';
        hintSection.classList.remove('show');
        hintText.classList.remove('show');
        hintText.textContent = '';
        hintBtn.style.display = 'inline-block';
        showAnswerBtn.style.display = 'none'; 
        answerDisplay.style.display = 'none'; 
        attemptsElement.textContent = ui.attemptsPrefix + '0';
        answerInput.focus();
    }

    function showNextQuestionPopup(nextIndex) {
        const popup = document.getElementById('next-question-popup');
        quizContent.style.opacity = '0.25';
        quizContent.style.pointerEvents = 'none';
        popup.classList.add('show');

        document.getElementById('nqp-btn').onclick = () => {
            popup.classList.remove('show');
            quizContent.style.opacity = '1';
            quizContent.style.pointerEvents = '';
            currentQuestionIndex = nextIndex;
            loadQuestion(currentQuestionIndex);
        };
    }

    function initialize() {
        loadQuestion(0);
    }

    function checkAnswer() {
        const userAnswer = answerInput.value.trim().toLowerCase();
        if (userAnswer === '') return;

        const q = questions[currentQuestionIndex];
        const isCorrect = q.correctAnswers.some(answer => 
            userAnswer === answer.toLowerCase()
        );
        
        if (isCorrect) {
            feedbackElement.textContent = ui.feedbackCorrect;
            feedbackElement.className = 'feedback correct show';
            createConfetti();

            setTimeout(() => {
                const nextIndex = currentQuestionIndex + 1;
                if (nextIndex < questions.length) {
                    showNextQuestionPopup(nextIndex);
                } else {
                    showSuccessCard();
                }
            }, 1000);
        } else {
            incorrectAttempts++;
            feedbackElement.textContent = ui.feedbackIncorrect;
            feedbackElement.className = 'feedback incorrect show';
            attemptsElement.textContent = ui.attemptsPrefix + incorrectAttempts;
            
            if (incorrectAttempts >= 2) {
                hintSection.classList.add('show');
            }
            
            answerInput.style.animation = 'shake 0.5s';
            setTimeout(() => { answerInput.style.animation = ''; }, 500);
            setTimeout(() => {
                answerInput.value = '';
                answerInput.focus();
            }, 1000);
        }
    }

    function showSuccessCard() {
        successCard.classList.add('show');
        quizContent.style.opacity = '0.3';
    }
    
    function hideSuccessCard() {
        successCard.classList.remove('show');
        quizContent.style.opacity = '1';
    }

    function provideHint() {
        const q = questions[currentQuestionIndex];
        if (currentHintIndex < q.hints.length) {
            hintText.textContent = q.hints[currentHintIndex];
            hintText.classList.add('show');
            currentHintIndex++;
            
            if (currentHintIndex >= q.hints.length) {
                hintBtn.style.display = 'none';
                showAnswerBtn.style.display = 'inline-block';
            }
        }
    }

    function revealAnswer() {
        const activeQuestion = questions[currentQuestionIndex];
        answerDisplay.innerHTML = ui.correctAnswerLabel + "<br>" + activeQuestion.correctAnswers[0];
        answerDisplay.style.lineHeight = "1.75";
        answerDisplay.style.display = 'block';
        showAnswerBtn.style.display = 'none'; 
    }

    function createConfetti() {
        const colors = ['#AA814B', '#8C6B3B', '#EDE6D6', '#A89F8E'];
        const container = document.querySelector('.content');
        
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.style.width = '10px';
            confetti.style.height = '10px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.position = 'absolute';
            confetti.style.borderRadius = '50%';
            confetti.style.top = '50%';
            confetti.style.left = '50%';
            
            container.appendChild(confetti);
            
            const animation = confetti.animate([
                { opacity: 1, transform: 'translate(0, 0) rotate(0deg)' },
                { opacity: 1, transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px) rotate(${Math.random() * 360}deg)` }
            ], {
                duration: 1000,
                easing: 'ease-out'
            });
            
            animation.onfinish = () => { confetti.remove(); };
        }
    }

    submitBtn.addEventListener('click', checkAnswer);
    hintBtn.addEventListener('click', provideHint);
    showAnswerBtn.addEventListener('click', revealAnswer); 
    successCardBtn.addEventListener('click', hideSuccessCard);
    
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    initialize();
</script>
</body>
</html>
