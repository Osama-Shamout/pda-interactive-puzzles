const LANG = document.documentElement.lang === 'ar' ? 'ar' : 'en';
const RTL = LANG === 'ar';
const T = CONFIG[LANG];
const fill = (text, vars) => text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
const $ = id => document.getElementById(id);
const touch = matchMedia('(pointer: coarse)').matches;
// The motion is part of the puzzle, so it always plays. Reduced-motion users only lose the camera drift.
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.title = T.pageTitle;

/* ---------- Uploaded files: on /ar/slug/ they usually sit beside the English page ---------- */
function assetUrls(name) {
  const here = new URL(name, location.href).href;
  const english = new URL(name, location.origin + location.pathname.replace(/^\/ar(?=\/)/, '') + location.search).href;
  return [...new Set([english, here])];
}

/* ---------- Sounds ----------
   Uploaded recordings (CONFIG.sounds) are used when given. Otherwise each sound is modelled on the real
   object: a short noise "strike" rings through resonators tuned to how wood, metal or amber vibrates.
   Every sound is rendered once offline, normalised, and played back with tiny pitch changes so repeats
   never sound identical. */
let audio = null;
const getAudio = () => {
  audio ??= new AudioContext();
  if (audio.state === 'suspended') audio.resume();
  return audio;
};
const SR = 44100;

// A struck object: noise burst → resonant modes [frequency Hz, gain, ring time s]
function strike(ctx, out, at, { modes, hp = 300, burst = 0.004, body = 1 }) {
  const len = Math.ceil(SR * burst), buf = ctx.createBuffer(1, len, SR), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const high = ctx.createBiquadFilter(); high.type = 'highpass'; high.frequency.value = hp;
  src.connect(high);
  const click = ctx.createGain(); click.gain.value = 0.35; high.connect(click).connect(out); // the contact itself
  for (const [f, g, ring] of modes) {
    const q = Math.PI * f * ring;                       // ring time sets how sharp the resonance is
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const amp = ctx.createGain(); amp.gain.value = g * Math.sqrt(q) * body;
    high.connect(bp).connect(amp).connect(out);
  }
  src.start(at);
}

// Stick-slip friction: an irregular train of tiny clicks through the hinge's resonances
function creak(ctx, out, at, dur) {
  const len = Math.ceil(SR * dur), buf = ctx.createBuffer(1, len, SR), d = buf.getChannelData(0);
  let t = 0;
  while (t < dur) {
    const p = t / dur, rate = 35 + 70 * Math.sin(Math.PI * p) + (Math.random() - 0.5) * 25; // pulses per second
    const i0 = Math.floor(t * SR), amp = Math.sin(Math.PI * p) ** 0.6 * (0.6 + Math.random() * 0.4);
    for (let k = 0; k < 90 && i0 + k < len; k++) d[i0 + k] += amp * Math.exp(-k / 14) * (Math.random() * 2 - 1);
    t += 1 / Math.max(12, rate);
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const mix = ctx.createGain(); mix.gain.value = 1;
  for (const [f, q, g] of [[720, 9, 1], [1530, 7, 0.6], [2950, 5, 0.25]]) {
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const amp = ctx.createGain(); amp.gain.value = g * 3;
    src.connect(bp).connect(amp).connect(mix);
  }
  mix.connect(out);
  src.start(at);
}

// Paper sliding: soft band-limited noise with a rustling flutter
function rustle(ctx, out, at, dur) {
  const len = Math.ceil(SR * dur), buf = ctx.createBuffer(1, len, SR), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const p = i / len, flutter = 0.55 + 0.45 * Math.sin(i / SR * 2 * Math.PI * (9 + 6 * Math.sin(p * 7)));
    d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * p) * flutter;
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 0.6;
  src.connect(bp).connect(out); src.start(at);
}

const WOOD = s => [[170 * s, 0.9, 0.05], [430 * s, 1, 0.04], [990 * s, 0.55, 0.025], [1750 * s, 0.3, 0.015], [2900 * s, 0.15, 0.008]];
const RECIPES = {
  // A wooden button pushed into its hole: first contact, then it bottoms out
  press: [0.25, (c, o) => { strike(c, o, 0, { modes: WOOD(1.15), hp: 600 }); strike(c, o, 0.045, { modes: WOOD(1.6), hp: 900, body: 0.55 }); }],
  // A button springing back up
  pop: [0.2, (c, o) => strike(c, o, 0, { modes: WOOD(1.9), hp: 1000, body: 0.7 })],
  // The catch inside the box: a small brass latch, then the lid knocks loose
  latch: [0.45, (c, o) => {
    strike(c, o, 0, { modes: [[2350, 1, 0.09], [4150, 0.7, 0.07], [6900, 0.45, 0.05], [9100, 0.25, 0.03]], hp: 1800, burst: 0.002 });
    strike(c, o, 0.07, { modes: WOOD(0.75), hp: 200, body: 0.9 });
  }],
  creak: [1.9, (c, o) => creak(c, o, 0, 1.75)],
  // The open lid coming to rest against its stop
  thud: [0.5, (c, o) => strike(c, o, 0, { modes: [[95, 1, 0.12], [240, 0.7, 0.08], [610, 0.35, 0.04]], hp: 60, burst: 0.01 })],
  // Two amber beads knocking together
  bead: [0.2, (c, o) => {
    strike(c, o, 0, { modes: [[2900, 1, 0.035], [4800, 0.6, 0.025], [7300, 0.35, 0.015]], hp: 2500, burst: 0.0015 });
    strike(c, o, 0.018, { modes: [[3300, 1, 0.03], [5600, 0.5, 0.02]], hp: 2500, burst: 0.0015, body: 0.4 });
  }],
  paper: [0.5, (c, o) => rustle(c, o, 0, 0.45)],
};
const LEVELS = { press: 0.55, pop: 0.32, latch: 0.6, creak: 0.35, thud: 0.6, bead: 0.3, paper: 0.25 };
const rendered = {};
async function renderSound(key) {
  const [dur, build] = RECIPES[key];
  const ctx = new OfflineAudioContext(1, Math.ceil(SR * dur), SR);
  build(ctx, ctx.destination);
  const buf = await ctx.startRendering(), d = buf.getChannelData(0);
  let peak = 0;
  for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
  if (peak > 0) for (let i = 0; i < d.length; i++) d[i] /= peak;
  rendered[key] = buf;
}
// Recordings uploaded in Admin replace the modelled sounds (keys as in CONFIG.sounds)
const recorded = {};
async function loadRecording(key) {
  const name = CONFIG.sounds[key];
  if (!name) return;
  const ctx = new OfflineAudioContext(1, SR, SR); // decodes without needing a user gesture
  for (const url of assetUrls(name)) {
    try {
      const res = await fetch(url);
      if (res.ok) { recorded[key] = await ctx.decodeAudioData(await res.arrayBuffer()); return; }
    } catch { /* try the next place */ }
  }
  console.warn(`Sound "${name}" could not be loaded; the built-in sound is used instead.`);
}
function play(key, delay = 0, level = 1) {
  if (CONFIG.sounds.volume <= 0) return;
  const buf = recorded[key] ?? rendered[key];
  if (!buf) return;
  const a = getAudio();
  const src = a.createBufferSource(), gain = a.createGain();
  src.buffer = buf;
  src.playbackRate.value = recorded[key] ? 1 : 0.95 + Math.random() * 0.1; // natural variation
  gain.gain.value = CONFIG.sounds.volume * (recorded[key] ? 1 : LEVELS[key]) * level;
  src.connect(gain).connect(a.destination);
  src.start(a.currentTime + delay);
}
const soundsReady = Promise.all([
  ...Object.keys(RECIPES).map(renderSound),
  ...Object.keys(CONFIG.sounds).filter(k => k !== 'volume').map(loadRecording),
]).catch(err => console.warn('Sounds unavailable:', err));

/* ---------- Procedural textures: no image files ---------- */
const hash = (x, y, s) => {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
};
function noise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) {
  let t = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { t += amp * noise(x * f, y * f, s + i); f *= 2.03; amp *= 0.5; }
  return t;
}
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

// Wood: wavy growth rings plus fine fibres running along the board
function woodTexture(size, light, dark, seed, rings = 9) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size), L = hex(light), D = hex(dark);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = x / size, ny = y / size;
      const ring = Math.sin((ny * rings + fbm(nx * 1.6, ny * 2.5, seed) * 2.6) * Math.PI * 2) * 0.5 + 0.5;
      const fibre = noise(nx * 6, ny * 160, seed + 11);
      const blotch = fbm(nx * 5, ny * 5, seed + 23);
      const t = Math.min(1, Math.max(0, ring ** 3 * 0.32 + fibre * 0.26 + blotch * 0.42 - 0.08));
      const i = (y * size + x) * 4;
      img.data[i] = L[0] + (D[0] - L[0]) * t;
      img.data[i + 1] = L[1] + (D[1] - L[1]) * t;
      img.data[i + 2] = L[2] + (D[2] - L[2]) * t;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.MirroredRepeatWrapping; // mirrored tiles hide the seams of the noise
  tex.anisotropy = 8;
  return tex;
}

// Prayer rug: dark wool, woven border bands and a central medallion (original pattern)
function rugTexture() {
  const w = 768, h = 1010, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#16121c'; g.fillRect(0, 0, w, h);
  const gold = 'rgba(176,150,112,', inset = (k, col) => { g.strokeStyle = col; g.lineWidth = 6; g.strokeRect(k, k, w - 2 * k, h - 2 * k); };
  inset(26, gold + '0.55)'); inset(64, gold + '0.4)'); inset(78, gold + '0.25)');
  // Border band: little diamonds
  g.fillStyle = gold + '0.45)';
  for (let x = 46; x < w - 40; x += 22) for (const y of [45, h - 45]) diamond(x, y, 7);
  for (let y = 46; y < h - 40; y += 22) for (const x of [45, w - 45]) diamond(x, y, 7);
  function diamond(x, y, r) { g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill(); }
  // Arch at the top of the field
  g.strokeStyle = gold + '0.35)'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(110, 360); g.lineTo(110, 250); g.quadraticCurveTo(w / 2, 90, w - 110, 250); g.lineTo(w - 110, 360); g.stroke();
  // Medallion: rings of petals
  g.save(); g.translate(w / 2, h * 0.56);
  for (const [n, r, len, a] of [[16, 150, 46, 0.32], [12, 96, 40, 0.42], [8, 46, 30, 0.5]]) {
    g.fillStyle = gold + a + ')';
    for (let i = 0; i < n; i++) {
      g.save(); g.rotate((i / n) * Math.PI * 2);
      g.beginPath(); g.ellipse(0, -r, len * 0.28, len * 0.5, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  }
  g.restore();
  // Wool fibres
  const img = g.getImageData(0, 0, w, h);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 18;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}

function textTexture(width, height, draw) {
  const c = document.createElement('canvas'); c.width = width; c.height = height;
  draw(c.getContext('2d'), width, height);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}

function wrapText(g, text, x, y, maxW, lh) {
  let line = '';
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); y += lh; line = word; }
    else line = test;
  }
  if (line) g.fillText(line, x, y);
  return y;
}

      map: fit(set.map), normalMap: fit(set.normalMap), roughnessMap: fit(set.roughnessMap),
      roughness: rough, normalScale: new THREE.Vector2(normal, normal), envMapIntensity: env,
    });
  }
  const t = fit(drawn());

}

/* ---------- Layout: side by side on wide screens, stacked on tall ones ---------- */
const VIEW = new THREE.Vector3(0, 1.32, 1).normalize();
const view = { center: new THREE.Vector3(0, 0.08, 0), radius: 4.5, focus: 0 }; // focus 0 = whole table, 1 = inside the box
function layout() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return; // not visible yet: keep the last good framing instead of dividing by zero
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (camera.aspect >= 1) {
    box.position.set(-0.62, 0, 0); box.rotation.y = 0.04;
    misbaha.position.set(0.72, 0, 0.02); misbaha.rotation.y = -0.06;
  } else {
    // Never turn the misbaha: "counting from the left" must stay the same side
    box.position.set(0, 0, -0.74); box.rotation.y = 0.02;
    misbaha.position.set(0, 0, 0.62); misbaha.rotation.y = 0;
  }
  const bounds = new THREE.Box3().setFromObject(content);
  bounds.getCenter(view.center);
  const sizeV = bounds.getSize(new THREE.Vector3());
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  // Distance so the table's width and its depth (seen at an angle) both fit, plus room for the label and status line
  const distW = (sizeV.x / 2) / Math.tan(hfov / 2) * 1.3;
  const distD = (sizeV.z * 0.62 + sizeV.y) / 2 / Math.tan(vfov / 2) * 1.3;
  view.radius = Math.max(distW, distD);
}
addEventListener('resize', layout);

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();

function hit(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.intersectObjects([...pegs, ...beads], false)[0]?.object;
}

  if (e.pointerType === 'mouse') {
    mouse.x = e.clientX / innerWidth - 0.5; mouse.y = e.clientY / innerHeight - 0.5;
    const o = hit(e);
    hovered = o && !(o.userData.n && (o.userData.down || locked || opened)) ? o : null;
    canvas.classList.toggle('hot', !!hovered);

});

  const o = hit(e);
  if (!o) return;
  if (o.userData.n) pressPeg(o);
  else toggleBead(o);
});

/* ---------- Box logic: like the real one, nothing is judged until enough buttons are down ---------- */
const seq = CONFIG.sequence, status = $('status');
let pressed = [], locked = false, opened = false;

const pegButtons = $('pegButtons');
pegButtons.setAttribute('aria-label', T.buttons);
pegs.forEach(peg => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = fill(T.button, { n: peg.userData.n });
  b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => pressPeg(peg));
  b.addEventListener('focus', () => peg.material.emissive.setHex(0x3a2408));
  b.addEventListener('blur', () => peg.material.emissive.setHex(0x000000));
  peg.userData.button = b;
  pegButtons.append(b);
});

function pressPeg(peg) {
  if (locked || peg.userData.down) return;
  peg.userData.down = true;
  peg.userData.button.setAttribute('aria-pressed', 'true');
  gsap.timeline()
    .to(peg.position, { y: pegY(true) - 0.004, duration: 0.09, ease: 'power2.in' })
    .to(peg.position, { y: pegY(true), duration: 0.18, ease: 'back.out(3)' });
  play('press');
  if (status.textContent) say('');
  pressed.push(peg.userData.n);
  if (pressed.length < seq.length) return;
  locked = true;
  if (pressed.every((n, i) => n === seq[i])) setTimeout(openBox, 500);
  else setTimeout(resetBox, 550);
}

function resetBox() {
  pegs.forEach((peg, i) => {
    if (peg.userData.down) play('pop', (i % 4) * 0.015 + Math.random() * 0.03, 0.8 + Math.random() * 0.3); // each spring-loaded button clacks back
    peg.userData.down = false;
    peg.userData.button.setAttribute('aria-pressed', 'false');
    gsap.to(peg.position, { y: pegY(false), duration: 0.22, ease: 'back.out(3)', delay: (i % 4) * 0.015 });
  });
  gsap.to(box.rotation, { keyframes: { z: [0, 0.012, -0.01, 0.006, 0] }, duration: 0.4, ease: 'none' });
  gsap.to(box.position, { keyframes: { y: [0, 0.012, 0] }, duration: 0.3, ease: 'power2.out' });
  say(T.wrong);
  pressed = [];
  locked = false;
}

function openBox() {
  opened = true;
  hovered = null; canvas.classList.remove('hot');
  say(T.solved);
  // In step with the motion below: the catch releases, the hinge creaks while the lid swings, the lid comes to rest
  play('latch');
  play('creak', 0.45);
  play('thud', 2.3);
  pegButtons.querySelectorAll('button').forEach(b => { b.disabled = true; });
  // The catch releases with a small jolt, then the lid swings up slowly and the camera leans in
  gsap.timeline()
    .to(hinge.rotation, { x: -0.06, duration: 0.25, ease: 'power2.out' })
    .to(hinge.rotation, { x: -0.03, duration: 0.2, ease: 'power2.inOut' })
    .to(hinge.rotation, { x: -1.72, duration: 1.9, ease: 'power3.inOut' })
    .to(view, { focus: 1, duration: 2.2, ease: 'power2.inOut' }, 0.6)
    .from(note.rotation, { z: -0.25, duration: 1.6, ease: 'power3.out' }, 1.0); // the note shifts as the lid lets go
  const reveal = document.createElement('div');
  reveal.className = 'sr';
  reveal.textContent = `${T.reveal.title}. ${T.reveal.text}`;
  document.body.append(reveal);
}

/* ---------- Beads: tap to mark while counting ---------- */
const beadButtons = $('beadButtons');
beadButtons.setAttribute('aria-label', T.beads);
beads.forEach((bead, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = fill(T.bead, { n: i + 1 });
  b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => toggleBead(bead));
  bead.userData.button = b;
  beadButtons.append(b);
});
function toggleBead(bead) {
  const ring = bead.userData.ring, on = !bead.userData.marked;
  bead.userData.marked = on;
  bead.userData.button.setAttribute('aria-pressed', String(on));
  play('bead');
  // A little hop for the bead, and the brass ring grows in or shrinks away
  gsap.timeline()
    .to(bead.position, { y: BEAD_Y + 0.018, duration: 0.12, ease: 'power2.out' })
    .to(bead.position, { y: BEAD_Y, duration: 0.35, ease: 'bounce.out' });
  if (on) {
    ring.visible = true;
    gsap.fromTo(ring.scale, { x: 0.4, y: 0.4, z: 0.4 }, { x: 1, y: 1, z: 1, duration: 0.4, ease: 'back.out(2.5)', overwrite: true });
  } else {
    gsap.to(ring.scale, { x: 0.4, y: 0.4, z: 0.4, duration: 0.15, ease: 'power1.in', overwrite: true, onComplete: () => { ring.visible = false; } });
  }
}

/* ---------- Hints: one at a time, then the answer ----------
   Progress is remembered on this device, so a reload does not hand out the hints again. */
const HINTS = T.hints, HU = T.ui;
const hintList = $('hintList'), hintBtn = $('hintBtn'), answerBtn = $('answerBtn'), hintToggle = $('hintToggle');
const hintKey = 'pda-hints:' + location.pathname.replace(/^\/ar(?=\/)/, '');
let hintsUsed = 0, answerShown = false;
try {
  const saved = JSON.parse(localStorage.getItem(hintKey) || '{}');
  hintsUsed = Math.min(saved.used ?? 0, HINTS.length);
  answerShown = !!saved.answer;
} catch { /* storage unavailable: start fresh */ }
const saveHints = () => { try { localStorage.setItem(hintKey, JSON.stringify({ used: hintsUsed, answer: answerShown })); } catch { /* ignore */ } };
$('hints').setAttribute('aria-label', HU.show);
answerBtn.textContent = HU.showAnswer;

function cardIn(card) {
  hintList.hidden = false;
  gsap.from(card, { y: 14, autoAlpha: 0, duration: 0.5, ease: 'power3.out' });
  card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  play('paper');
}
function addHint(i, animate) {
  const li = document.createElement('li');
  li.className = 'card';
  li.append(
    Object.assign(document.createElement('span'), { className: 'tag', textContent: fill(HU.hintTitle, { n: i + 1, total: HINTS.length }) }),
    document.createTextNode(HINTS[i]),
  );
  hintList.append(li);
  if (animate) cardIn(li);
}
function addAnswer(animate) {
  const li = document.createElement('li');
  li.className = 'card answer';
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.setAttribute('aria-hidden', 'true');
  for (let n = 1; n <= 16; n++) {
    const step = CONFIG.sequence.indexOf(n);
    grid.append(Object.assign(document.createElement('span'), { className: step >= 0 ? 'on' : '', textContent: step >= 0 ? step + 1 : '' }));
  }
  li.append(
    Object.assign(document.createElement('span'), { className: 'tag', textContent: HU.answerTitle }),
    document.createTextNode(`${fill(T.answer, { ids: CONFIG.starIds.join(' / ') })} ${CONFIG.sequence.map(n => fill(T.button, { n })).join(RTL ? '، ' : ', ')}`),
    grid,
  );
  hintList.append(li);
  if (animate) cardIn(li);
}
// Fade a button out quickly, then (optionally) pop another one in
function swapButton(out, inn, animate) {
  if (!animate) { out.hidden = true; if (inn) inn.hidden = false; return; }
  gsap.to(out, { autoAlpha: 0, scale: 0.96, duration: 0.15, ease: 'power1.out', onComplete: () => {
    out.hidden = true; gsap.set(out, { clearProps: 'opacity,visibility,scale' });
    if (!inn) return;
    inn.hidden = false;
    gsap.from(inn, { autoAlpha: 0, scale: 0.96, duration: 0.3, ease: 'back.out(1.6)' });
  } });
}
function updateHintButtons(animate) {
  hintBtn.replaceChildren(HU.hint, Object.assign(document.createElement('span'), { className: 'count', textContent: `${hintsUsed}/${HINTS.length}` }));
  if (hintsUsed >= HINTS.length && !hintBtn.hidden) swapButton(hintBtn, answerShown ? null : answerBtn, animate); // all hints used
  if (answerShown && !answerBtn.hidden) swapButton(answerBtn, null, animate);                                     // answer revealed
  hintToggle.hidden = hintsUsed === 0;
  hintToggle.textContent = hintList.hidden ? HU.show : HU.hide;
}
hintBtn.addEventListener('click', () => {
  if (hintsUsed >= HINTS.length) return;
  addHint(hintsUsed, true);
  hintsUsed++;
  saveHints();
  updateHintButtons(true);
});
answerBtn.addEventListener('click', () => {
  answerShown = true;
  saveHints();
  addAnswer(true);
  updateHintButtons(true);
});
hintToggle.addEventListener('click', () => {
  hintList.hidden = !hintList.hidden;
  if (!hintList.hidden) gsap.from(hintList.children, { y: 10, autoAlpha: 0, duration: 0.35, ease: 'power2.out', stagger: 0.04 });
  hintToggle.textContent = hintList.hidden ? HU.show : HU.hide;
});
for (let i = 0; i < hintsUsed; i++) addHint(i, false);
if (answerShown) addAnswer(false);
hintList.hidden = hintsUsed === 0;
hintBtn.hidden = hintsUsed >= HINTS.length;
answerBtn.hidden = hintsUsed < HINTS.length || answerShown;
updateHintButtons(false);

/* ---------- Loop ---------- */
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const cam = { x: 0, y: 0 };
const look = new THREE.Vector3(), boxWorld = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  cam.x = damp(cam.x, calm ? 0 : mouse.x * 0.18, 2.5, dt);
  cam.y = damp(cam.y, calm ? 0 : -mouse.y * 0.1, 2.5, dt);
  // Hover: buttons glow warm and swell a touch, beads swell; both ease back when the mouse leaves
  for (const peg of pegs) {
    const on = peg === hovered ? 1 : 0;
    peg.userData.glow = damp(peg.userData.glow ?? 0, on, on ? 14 : 6, dt);
    const s = 1 + peg.userData.glow * 0.05;
    peg.scale.set(s, 1, s);
    if (document.activeElement !== peg.userData.button) peg.material.emissive.setRGB(0.12 * peg.userData.glow, 0.06 * peg.userData.glow, 0.01 * peg.userData.glow);
  }
  for (const bead of beads) {
    const target = bead === hovered ? 1.14 : 1;
    const s = damp(bead.scale.x, target, bead === hovered ? 14 : 6, dt);
    bead.scale.setScalar(s);
  }
  box.getWorldPosition(boxWorld);
  look.copy(view.center).lerp(boxWorld, view.focus);
  const dist = THREE.MathUtils.lerp(view.radius, 1.55, view.focus);
  camera.position.copy(look).addScaledVector(VIEW, dist);
  // Fog only darkens the far edges of the table. It follows the camera, because on a tall phone screen
  // the camera sits further back and fixed fog would grey out the box and the misbaha.
  scene.fog.near = dist + 0.9;
  scene.fog.far = dist + 4.5;
  camera.position.x += cam.x; camera.position.y += cam.y;
  camera.lookAt(look);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
await Promise.all([
  RTL ? document.fonts.load('700 104px "Amiri"') : document.fonts.load('italic 600 92px "Cormorant Garamond"'),
  document.fonts.load('40px "Special Elite"'),
  RTL ? document.fonts.load('400 48px "Amiri"') : null,
].map(p => p?.catch(() => {})));
// Redraw the text textures now that the fonts are in
engravingTex.image.getContext('2d').clearRect(0, 0, 1600, 170);
{
  const g = engravingTex.image.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = RTL ? 'rtl' : 'ltr';
  g.font = RTL ? '700 104px "Amiri"' : 'italic 600 92px "Cormorant Garamond"';
  g.fillStyle = 'rgba(255,215,170,0.16)'; g.fillText(T.engraving, 800, 88);
  g.fillStyle = 'rgba(24,9,2,0.92)'; g.fillText(T.engraving, 800, 85);
  engravingTex.needsUpdate = true;
}
drawNote(noteTexture.image.getContext('2d'), 900, 1100);
noteTexture.needsUpdate = true;
if (T.reveal.image) {
  const urls = assetUrls(T.reveal.image), img = new Image();
  img.onload = () => { drawNote(noteTexture.image.getContext('2d'), 900, 1100, img); noteTexture.needsUpdate = true; };
  img.onerror = () => { urls.shift(); if (urls.length) img.src = urls[0]; };
  img.src = urls[0];
}

layout();requestAnimationFrame(frame);
$('loader').classList.add('done');
// Entrance: the lamp warms up while the camera glides down to the table, then the label fades in
gsap.timeline({ delay: 0.1 })
  .from(view, { radius: view.radius * 1.4, duration: 2.4, ease: 'expo.out' })
  .from(lamp, { intensity: 0, duration: 1.6, ease: 'power2.out' }, 0)
  .from(misbaha.position, { y: 0.06, duration: 1.6, ease: 'power3.out' }, 0.2)
  .from('#label', { autoAlpha: 0, y: -6, duration: 0.6, ease: 'power2.out' }, 0.9)
  .from('#hints', { autoAlpha: 0, y: 8, duration: 0.6, ease: 'power2.out' }, 1.1);
</script>
</body>
</html>
