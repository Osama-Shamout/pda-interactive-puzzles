<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Neonderthaw&family=Reem+Kufi:wght@500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --room: #0e0b09; --ink: #e9dcc4; --dim: rgba(233, 220, 196, 0.6); --brass: #c9a45c;
    --right: #e8842a; --left: #2f7de1;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --type: "Special Elite", "Courier New", monospace;
  }
  html[lang="ar"] { --type: "Amiri", serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--room); color: var(--ink); font-family: var(--type);
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; } /* swipes look around the room */
  #gl.hot { cursor: pointer; }

  .film {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 75% 70% at 50% 45%, transparent 45%, rgba(0,0,0,0.75) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .label {
    position: fixed; z-index: 2; margin: 0; font-weight: 400; font-size: 14px; color: var(--dim);
    top: max(20px, env(safe-area-inset-top)); inset-inline-start: max(20px, env(safe-area-inset-left));
  }
  html[lang="ar"] .label { font-size: 18px; }
  .status {
    position: fixed; z-index: 2; left: 0; right: 0; margin: 0; padding: 0 16px; text-align: center;
    bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px));
    font-size: 15px; text-shadow: 0 1px 8px rgba(0,0,0,0.9); pointer-events: none;
  }
  html[lang="ar"] .status { font-size: 19px; }
  @media (max-width: 640px) { .status { bottom: max(78px, calc(env(safe-area-inset-bottom) + 70px)); } }

  .loader {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: var(--room); color: var(--dim); font-size: 15px;
    transition: opacity 0.8s var(--ease), visibility 0.8s;
  }
  .loader.done { opacity: 0; visibility: hidden; }

  /* ---------- Hotspot markers: soft pulsing rings over the things you can look at ---------- */
  .spots { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .spot {
    position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border: 0;
    border-radius: 50%; background: transparent; cursor: pointer; pointer-events: auto;
    display: grid; place-items: center; transition: opacity 0.4s var(--ease);
  }
  .spot::before {
    content: ""; width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255, 236, 200, 0.92); box-shadow: 0 0 12px rgba(255, 210, 140, 0.9);
  }
  .spot::after {
    content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255, 230, 190, 0.8); animation: ping 2.2s var(--ease) infinite;
  }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(3); opacity: 0; } }
  .spot:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .spot.away { opacity: 0; pointer-events: none; }
  .tip {
    position: fixed; z-index: 3; padding: 6px 10px; border-radius: 6px; pointer-events: none;
    background: rgba(18, 14, 10, 0.85); color: var(--ink); font-size: 13px; white-space: nowrap;
    opacity: 0; transform: translate(-50%, -150%); transition: opacity 0.15s ease-out;
  }
  html[lang="ar"] .tip { font-size: 16px; }
  .tip.on { opacity: 1; }

  /* ---------- Shared buttons ---------- */
  .pill {
    height: 44px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink);
    background: rgba(24, 18, 13, 0.78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(233,220,196,0.14), 0 8px 22px rgba(0,0,0,0.45);
    transition-property: background-color, scale; transition-duration: 0.15s; transition-timing-function: var(--ease);
  }
  html[lang="ar"] .pill { font-size: 18px; }
  .pill:hover { background: rgba(48, 36, 26, 0.9); }
  .pill:active { scale: 0.96; }
  .pill:focus-visible, .key:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .pill[hidden] { display: none; }
  .pill .count { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .pill.quiet { background: transparent; box-shadow: none; color: var(--dim); padding: 0 10px; }

  /* ---------- Hints ---------- */
  .hints {
    position: fixed; z-index: 4; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    inset-inline-end: max(16px, env(safe-area-inset-right)); bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px));
    width: min(330px, calc(100vw - 32px)); pointer-events: none;
  }
  .hints > * { pointer-events: auto; }
  .hint-list {
    list-style: none; margin: 0; padding: 4px; width: 100%; display: flex; flex-direction: column; gap: 10px;
    max-height: min(46vh, 420px); overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: rgba(233,220,196,0.3) transparent;
  }
  .hint-list[hidden] { display: none; }
  .card {
    background: #efe3c8; color: #2a1f14; border-radius: 3px; padding: 12px 14px; font-size: 14px; line-height: 1.5;
    text-wrap: pretty; box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 10px 24px rgba(0,0,0,0.5);
  }
  .card:nth-child(odd) { rotate: -0.8deg; } .card:nth-child(even) { rotate: 0.6deg; }
  .card .tag { display: block; font-size: 12px; color: #8a3b1e; margin-bottom: 4px; }
  .card .look {
    margin-top: 8px; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer;
    background: #2a1f14; color: #efe3c8; font-size: 13px; transition: scale 0.15s var(--ease);
  }
  .card .look:active { scale: 0.96; }
  html[lang="ar"] .card { font-size: 17px; line-height: 1.7; }
  html[lang="ar"] .card .tag, html[lang="ar"] .card .look { font-size: 15px; }
  .hint-actions { display: flex; gap: 8px; }
  .music {
    position: fixed; z-index: 4; inset-inline-start: max(16px, env(safe-area-inset-left)); bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px));
  }
  .music svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .music[aria-pressed="false"] { color: var(--dim); }
  .music[aria-pressed="false"] svg { opacity: 0.5; }

  /* ---------- Close-up views (sheet, painting, behind the door) ---------- */
  .view {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 64px 16px 24px;
    background: rgba(8, 6, 4, 0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    overflow: auto; touch-action: pan-x pan-y pinch-zoom;
  }
  .view[hidden] { display: none; }
  .view .close { position: fixed; top: max(14px, env(safe-area-inset-top)); inset-inline-end: max(14px, env(safe-area-inset-right)); z-index: 2; }
  .view-body { max-width: min(860px, 100%); width: 100%; display: grid; justify-items: center; gap: 14px; }

  .brass-plate {
    padding: 26px 34px; border-radius: 10px; text-align: center; max-width: 100%;
    background: linear-gradient(135deg, #f2d895 0%, #c79b4c 35%, #f0d48c 55%, #a8823e 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -3px 0 rgba(0,0,0,0.25), 0 18px 40px rgba(0,0,0,0.6);
  }
  .brass-plate p {
    margin: 0; font-family: "Special Elite", serif; font-weight: 400; font-size: clamp(24px, 5vw, 40px); line-height: 1.5;
    color: #3a2608; text-shadow: 0 1px 0 rgba(255,240,200,0.6), 0 -1px 0 rgba(60,35,5,0.35);
  }
  html[lang="ar"] .brass-plate p { font-family: "Amiri", serif; font-weight: 700; }
  /* Aged paper: soft fibres and darker edges */
  .paper {
    background-color: #f1e6c9; color: #2a1f14; border-radius: 3px; width: 100%;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.04 0.6' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.18  0 0 0 0.12 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
      radial-gradient(ellipse at 50% 45%, rgba(255,250,235,0.55), rgba(160,120,60,0.28));
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 24px 60px rgba(0,0,0,0.6);
  }
  /* Gilded frame around the oil painting */
  .frame {
    padding: clamp(12px, 2.4vw, 26px); border-radius: 4px; width: min(880px, 100%);
    background: linear-gradient(135deg, #8a6420 0%, #e9c46a 18%, #a37a2c 36%, #f3d98a 52%, #9a7028 70%, #d9b25a 86%, #7a561a 100%);
    box-shadow: inset 0 0 0 3px rgba(60,40,10,0.6), inset 0 0 0 7px rgba(255,230,160,0.35), inset 0 0 18px rgba(0,0,0,0.6), 0 26px 60px rgba(0,0,0,0.65);
  }
  .frame canvas { display: block; width: 100%; height: auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4), 0 0 0 2px rgba(40,25,5,0.7); }
  /* Picture sheet (Hint 2) */
  .sheet { padding: 22px clamp(14px, 3vw, 30px) 30px; direction: ltr; }
  .sheet h2 { margin: 0; text-align: center; font-family: "Special Elite", serif; font-weight: 400; font-size: 28px; }
  html[lang="ar"] .sheet h2 { font-family: "Amiri", serif; font-weight: 700; font-size: 30px; }
  html[lang="ar"] .sheet h3 { direction: rtl; font-size: 17px; }
  .sheet .sub { margin: 4px auto 14px; text-align: center; font-size: 13px; color: #6a5a44; max-width: 60ch; }
  html[lang="ar"] .sheet .sub { direction: rtl; font-size: 16px; }
  .sheet h3 { margin: 16px 0 8px; font-size: 14px; color: #7a4a16; font-weight: 400; }
  .sheet .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .cell { position: relative; border: 1px solid #c9b48a; border-radius: 6px; padding: 18px 5px 5px; background: rgba(255,250,235,0.6); }
  .cell b {
    position: absolute; top: 3px; left: 4px; width: 18px; height: 18px; border-radius: 50%;
    background: #2a1f14; color: #f1e6c9; font: 700 10px/18px Arial, sans-serif; text-align: center;
  }
  .cell small { position: absolute; top: 4px; right: 6px; font: 10px Arial, sans-serif; }
  .cell svg { display: block; width: 100%; height: auto; }
  /* Painting (Hint 3) */
  /* Behind the door */
  .reveal { padding: 34px 30px; max-width: 520px; text-align: center; }
  .reveal h2 { margin: 0 0 12px; font-weight: 400; font-size: 26px; }
  .reveal p { margin: 0; font-size: 17px; line-height: 1.6; }
  .reveal img { max-width: 100%; margin-bottom: 14px; }
  html[lang="ar"] .reveal h2 { font-family: "Amiri", serif; font-weight: 700; font-size: 30px; }
  html[lang="ar"] .reveal p { font-size: 20px; }

  /* ---------- The piano ---------- */
  .piano {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: center; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), transparent 18%),
      linear-gradient(180deg, #17120e 0%, #0b0907 55%, #120d0a 100%);
    touch-action: none;
  }
  .piano[hidden] { display: none; }
  .piano-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; direction: ltr; }
  .lamps { display: flex; gap: 14px; }
  .lamps i {
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6b5a3a, #2e2416);
    box-shadow: inset 0 0 0 2px #8a6f3c; transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease);
  }
  .lamps i.on { background: radial-gradient(circle at 35% 30%, #fff3c4, #f2b84b); box-shadow: inset 0 0 0 2px #c9a45c, 0 0 18px 4px rgba(255,190,90,0.75); }
  .kb { position: relative; direction: ltr; }
  .kb .hand {
    display: block; margin: 0 0 6px; font-size: 12px; letter-spacing: 0.02em; font-family: Arial, sans-serif; font-weight: 700;
  }
  .kb-r .hand { color: var(--right); } .kb-l .hand { color: var(--left); }
  html[lang="ar"] .kb .hand { font-family: "Amiri", serif; font-size: 15px; direction: rtl; text-align: right; }
  /* Red felt strip above the keys, as on a real piano */
  .keys {
    position: relative; display: flex; height: clamp(90px, 30vh, 190px);
    border-top: 7px solid #6b1414; border-radius: 3px;
    box-shadow: 0 -1px 0 #2a0606, 0 10px 24px rgba(0,0,0,0.6);
  }
  .key { position: relative; border: 0; padding: 0; cursor: pointer; touch-action: none; }
  .key.white {
    flex: 1; margin: 0 1px; border-radius: 0 0 6px 6px;
    background: linear-gradient(180deg, #ece5d3 0%, #fffdf6 12%, #f6f0e2 85%, #e2dac6 100%);
    box-shadow: inset 0 -6px 0 #d4cbb4, inset 0 0 0 1px rgba(0,0,0,0.12), 0 3px 4px rgba(0,0,0,0.5);
    transition: transform 0.06s ease-out, box-shadow 0.06s ease-out, background 0.06s ease-out;
  }
  .key.black {
    position: absolute; top: 0; z-index: 2; width: 6.2%; height: 62%; border-radius: 0 0 4px 4px;
    background: linear-gradient(180deg, #050505 0%, #2b2b2b 70%, #111 100%);
    box-shadow: inset 0 -5px 0 #000, inset 1px 0 0 rgba(255,255,255,0.12), 0 4px 6px rgba(0,0,0,0.6);
    transition: transform 0.06s ease-out, box-shadow 0.06s ease-out;
  }
  .key.black::before { content: ""; position: absolute; inset: 0 -6px; } /* wider hit area for thumbs */
  .key.down { transform: translateY(3px); }
  .kb-r .key.white.down { background: linear-gradient(180deg, #f3d3b0, #fbe6cf); box-shadow: inset 0 -3px 0 #d4a57a, inset 0 0 18px rgba(232,132,42,0.65), 0 1px 2px rgba(0,0,0,0.5); }
  .kb-l .key.white.down { background: linear-gradient(180deg, #c8daf3, #e3edfb); box-shadow: inset 0 -3px 0 #8fb0dc, inset 0 0 18px rgba(47,125,225,0.6), 0 1px 2px rgba(0,0,0,0.5); }
  .kb-r .key.black.down { box-shadow: inset 0 -2px 0 #000, inset 0 0 14px rgba(232,132,42,0.95), 0 1px 3px rgba(0,0,0,0.6); }
  .kb-l .key.black.down { box-shadow: inset 0 -2px 0 #000, inset 0 0 14px rgba(47,125,225,0.95), 0 1px 3px rgba(0,0,0,0.6); }
  /* "Show answer": the next keys to press glow and pulse */
  .key.guide { z-index: 1; animation: guide 0.9s ease-in-out infinite alternate; }
  .key.black.guide { z-index: 3; }
  .kb-r .key.white.guide { background: linear-gradient(180deg, #ffd28a, #fff1c9); --glow: rgba(255,170,60,0.95); }
  .kb-l .key.white.guide { background: linear-gradient(180deg, #9cc6ff, #e2efff); --glow: rgba(80,160,255,0.95); }
  .kb-r .key.black.guide { background: linear-gradient(180deg, #a85a10, #f0a040); --glow: rgba(255,170,60,0.95); }
  .kb-l .key.black.guide { background: linear-gradient(180deg, #1d4f9c, #5aa0ff); --glow: rgba(80,160,255,0.95); }
  @keyframes guide {
    from { box-shadow: 0 0 16px 4px var(--glow), 0 0 4px 1px #fff, inset 0 0 16px rgba(255,255,255,0.7); filter: brightness(1.05); }
    to   { box-shadow: 0 0 44px 16px var(--glow), 0 0 8px 2px #fff, inset 0 0 26px #fff; filter: brightness(1.25); }
  }
  .key .letter {
    position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; pointer-events: none;
    font: 700 13px Arial, sans-serif; color: rgba(40,30,20,0.55);
  }
  .key.black .letter { bottom: 8px; color: rgba(255,255,255,0.6); font-size: 11px; }
  @media (pointer: coarse) { .key .letter { display: none; } }
  .coach {
    position: absolute; inset: -6px; border: 2px dashed; border-radius: 8px; pointer-events: none; transition: opacity 0.6s ease-out;
  }
  .kb-r .coach { border-color: rgba(232,132,42,0.85); } .kb-l .coach { border-color: rgba(47,125,225,0.85); }
  .coach.gone { opacity: 0; }
  .piano-note { margin: 0; text-align: center; font-size: 13px; color: var(--dim); min-height: 1.4em; transition: opacity 0.4s ease-out; }
  html[lang="ar"] .piano-note { font-size: 16px; }
  .rotate {
    position: fixed; inset: 0; z-index: 30; display: none; place-items: center; text-align: center;
    background: #0b0907; color: var(--ink); padding: 24px;
  }
  .rotate svg { width: 84px; height: 84px; margin: 0 auto 14px; display: block; animation: turn 2.4s var(--ease) infinite; }
  @keyframes turn { 0%, 20% { rotate: 0deg; } 60%, 100% { rotate: -90deg; } }
  .rotate p { margin: 4px 0; font-size: 18px; }
  .rotate p + p { font-family: "Amiri", serif; color: var(--brass); }
  @media (orientation: portrait) and (pointer: coarse) { body.playing .rotate { display: grid; } }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .spot::after { animation: none; } }
</style>

<script type="module">

/* ===================== Background music after solving: Für Elise ===================== */
// Beethoven (public domain), arranged for this piano: the theme with both hands, its repeat,
// the C-major episode and the theme again. Unit = one sixteenth note; a bar of 3/8 is 6 units.
function furElise() {

    for (const [o, n, l] of lh) ev.push([t + o, n, l, 0.32]);
    t += 6;
  };

  const am = rh => bar(rh, [[0, 'A2', 1], [1, 'E3', 1], [2, 'A3', 3]]);
  const e7 = rh => bar(rh, [[0, 'E2', 1], [1, 'E3', 1], [2, 'G#3', 3]]);
  const theme = ending => {
    motif();
    am([[0, 'A4', 2], [3, 'C4', 1], [4, 'E4', 1], [5, 'A4', 1]]);
    e7([[0, 'B4', 2], [3, 'E4', 1], [4, 'G#4', 1], [5, 'B4', 1]]);
    am([[0, 'C5', 2], [3, 'E4', 1], [4, 'E5', 1], [5, 'D#5', 1]]);
    motif();
    am([[0, 'A4', 2], [3, 'C4', 1], [4, 'E4', 1], [5, 'A4', 1]]);
    e7([[0, 'B4', 2], [3, 'E4', 1], [4, 'C5', 1], [5, 'B4', 1]]);
    ending();
  };
  ev.push([0, 'E5', 1, 0.5], [1, 'D#5', 1, 0.5]); t = 2;                       // upbeat
  theme(() => am([[0, 'A4', 2], [4, 'E5', 1], [5, 'D#5', 1]]));               // first ending, back to the top
  theme(() => am([[0, 'A4', 2], [3, 'B4', 1], [4, 'C5', 1], [5, 'D5', 1]]));  // second ending, into the episode
  bar([[0, 'E5', 3], [3, 'G4', 1], [4, 'F5', 1], [5, 'E5', 1]], [[0, 'C3', 1], [1, 'G3', 1], [2, 'C4', 3]]);
  bar([[0, 'D5', 3], [3, 'F4', 1], [4, 'E5', 1], [5, 'D5', 1]], [[0, 'G2', 1], [1, 'G3', 1], [2, 'B3', 3]]);
  bar([[0, 'C5', 3], [3, 'E4', 1], [4, 'D5', 1], [5, 'C5', 1]], [[0, 'A2', 1], [1, 'E3', 1], [2, 'A3', 3]]);
  bar([[0, 'B4', 2], [3, 'E4', 1], [4, 'E5', 2]], [[0, 'E2', 1], [1, 'E3', 1], [2, 'E4', 3]]);
  bar([[0, 'E5', 1], [1, 'D#5', 1], [2, 'E5', 1], [3, 'D#5', 1], [4, 'E5', 1], [5, 'D#5', 1]]); // the trill leading home
  theme(() => bar([[0, 'A4', 9]], [[0, 'A2', 9], [0, 'E3', 9], [0, 'A3', 9]]));                // final chord
  return { events: ev, units: t };
}

// The house breathes: a low dissonant drone, wind in the walls, and now and then a creak,
// a distant knock, or two notes of the tune played by no one.
function brownNoise(a, seconds) {
  const len = Math.ceil(a.sampleRate * seconds), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  return buf;
}
function ghostNotes() {
  if (!samples.size || pianoOpen) return;
  const a = getAudio(), phrases = [['E5', 'D#5'], ['E5', 'D#5', 'E5'], ['B4'], ['A4']];
  const phrase = phrases[Math.floor(Math.random() * phrases.length)];
  phrase.forEach((note, i) => {
    const at = a.currentTime + i * 0.55, v = hauntedVoice(a, note, at, 0.14 * CONFIG.volume, { send: 1.4, warble: 0.008 });
    v.gain.gain.setTargetAtTime(0, at + 0.6, 1.2);
    for (const s of v.srcs) s.stop(at + 6);
  });
}
function startAmbience() {
  if (ambience || !soundOn) return;
  const a = getAudio(), { verb } = getFx();
  const bus = a.createGain(), send = a.createGain();
  bus.gain.setValueAtTime(0, a.currentTime);
  bus.gain.linearRampToValueAtTime(0.5 * CONFIG.volume, a.currentTime + 5);
  send.gain.value = 0.4;
  bus.connect(a.destination); bus.connect(send).connect(verb);
  // Drone: low tones a semitone apart, beating against each other, behind a slowly breathing filter
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240; lp.connect(bus);
  const breath = a.createOscillator(), breathDepth = a.createGain();
  breath.frequency.value = 0.05; breathDepth.gain.value = 110; breath.connect(breathDepth).connect(lp.frequency);
  const tones = [[55, 'sawtooth', 0.045], [58.27, 'sawtooth', 0.035], [27.5, 'sine', 0.14], [82.41, 'triangle', 0.018]].map(([f, type, g]) => {
    const o = a.createOscillator(), og = a.createGain();
    o.type = type; o.frequency.value = f; og.gain.value = g; o.connect(og).connect(lp);
    return o;
  });
  // Wind through the walls
  const wind = a.createBufferSource(), band = a.createBiquadFilter(), windGain = a.createGain();
  wind.buffer = brownNoise(a, 8); wind.loop = true;
  band.type = 'bandpass'; band.frequency.value = 480; band.Q.value = 0.9; windGain.gain.value = 0.55;
  wind.connect(band).connect(windGain).connect(bus);
  const gust = a.createOscillator(), gustDepth = a.createGain();
  gust.frequency.value = 0.07; gustDepth.gain.value = 280; gust.connect(gustDepth).connect(band.frequency);
  const all = [breath, gust, wind, ...tones];
  all.forEach(n => n.start());
  // Something in the house, every 7 to 18 seconds
  let timer = 0;
  const event = () => {
    const r = Math.random();
    if (r < 0.35) play('creak', 0, 0.6); else if (r < 0.55) play('thud', 0, 0.45); else ghostNotes();
    timer = setTimeout(event, 7000 + Math.random() * 11000);
  };
  timer = setTimeout(event, 6000);
  ambience = {
    stop() {
      clearTimeout(timer);
      bus.gain.cancelScheduledValues(a.currentTime); bus.gain.setTargetAtTime(0, a.currentTime, 0.6);
      setTimeout(() => { all.forEach(n => n.stop()); bus.disconnect(); }, 3500);
      ambience = null;
    },
  };
}

// An oil painting of Amman's hills at dusk. Nine white stone houses sit on the ridge: the higher the house,
// the higher the note, and the first note is the house on the RIGHT (CONFIG.painting). Everything else is scenery.
function drawPainting(g, w, h) {
  let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stroke = (x, y, len, width, color, angle = 0) => {
    g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len); g.stroke();
  };
  // Dusk sky: deep blue above, warm apricot at the horizon
  const sky = g.createLinearGradient(0, 0, 0, h * 0.75);
  sky.addColorStop(0, '#3f5577'); sky.addColorStop(0.45, '#9a8aa0'); sky.addColorStop(0.75, '#e9b787'); sky.addColorStop(1, '#f4d3a2');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  const sun = g.createRadialGradient(w * 0.7, h * 0.52, 0, w * 0.7, h * 0.52, w * 0.35);
  sun.addColorStop(0, 'rgba(255,226,170,0.85)'); sun.addColorStop(1, 'rgba(255,226,170,0)');
  g.fillStyle = sun; g.fillRect(0, 0, w, h);
  // Sky brushwork and soft clouds
  for (let i = 0; i < 900; i++) {
    const y = r() * h * 0.6, warm = y / (h * 0.6);
    stroke(r() * w, y, 20 + r() * 60, 3 + r() * 7, `rgba(${200 + warm * 50},${170 + warm * 40},${170 - warm * 30},${0.05 + r() * 0.06})`, (r() - 0.5) * 0.15);
  }
  for (let c = 0; c < 5; c++) {
    const cx = r() * w, cy = h * (0.1 + r() * 0.25);
    for (let i = 0; i < 40; i++) stroke(cx + (r() - 0.5) * w * 0.18, cy + (r() - 0.5) * h * 0.04, 30 + r() * 60, 6 + r() * 8, `rgba(255,${220 + r() * 20},${200 + r() * 30},0.08)`, (r() - 0.5) * 0.1);
  }
  // Two layers of distant hills, hazier the further they are
  const ridgeLine = (base, amp, freq, phase, color) => {
    g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += w / 120) g.lineTo(x, base + Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 2.7 + phase) * amp * 0.35);
    g.lineTo(w, h); g.closePath(); g.fillStyle = color; g.fill();
  };
  ridgeLine(h * 0.5, h * 0.04, 0.006, 1.2, 'rgba(140,120,140,0.55)');
  ridgeLine(h * 0.58, h * 0.035, 0.009, 3.1, 'rgba(150,115,100,0.6)');

  // The ridge with the nine houses
  const drops = CONFIG.painting, n = drops.length, maxDrop = Math.max(...drops);
  const left = w * 0.12, right = w * 0.88, top = h * 0.3, bottom = h * 0.6;
  const pts = drops.map((dp, i) => ({ x: right - (i / (n - 1)) * (right - left), y: top + (dp / maxDrop) * (bottom - top) }));
  const ridge = [...pts].sort((a, b) => a.x - b.x);
  g.beginPath(); g.moveTo(0, h); g.lineTo(0, ridge[0].y + h * 0.12);
  ridge.forEach((p, i) => {
    const prev = ridge[i - 1] ?? { x: 0, y: p.y + h * 0.12 };
    g.quadraticCurveTo((prev.x + p.x) / 2, (prev.y + p.y) / 2 + h * 0.015, p.x, p.y + h * 0.02);
  });
  g.lineTo(w, ridge.at(-1).y + h * 0.1); g.lineTo(w, h); g.closePath();
  const hill = g.createLinearGradient(0, top, 0, h);
  hill.addColorStop(0, '#b78a5c'); hill.addColorStop(0.5, '#8c6440'); hill.addColorStop(1, '#4e3522');
  g.fillStyle = hill; g.fill();
  g.save(); g.clip(); // brush texture of earth, rock and dry grass, only inside the hill
  for (let i = 0; i < 2600; i++) {
    const shade = r();
    stroke(r() * w, top + r() * (h - top), 6 + r() * 22, 2 + r() * 5,
      shade > 0.6 ? `rgba(214,176,120,${0.1 + r() * 0.12})` : shade > 0.25 ? `rgba(110,78,48,${0.1 + r() * 0.12})` : `rgba(120,120,70,${0.08 + r() * 0.1})`,
      (r() - 0.5) * 0.6);
  }
  g.restore();

  // Amman houses: white limestone cubes with flat roofs and warm lit windows, light from the right
  const s = w * 0.024;
  for (const p of pts) {
    const bx = p.x - s, by = p.y - s * 1.6;
    g.fillStyle = 'rgba(40,25,15,0.35)'; g.fillRect(bx - s * 0.5, p.y + h * 0.012, s * 2.6, s * 0.35);   // ground shadow
    g.fillStyle = '#b9ab92'; g.fillRect(bx - s * 0.45, by + s * 0.18, s * 0.45, s * 1.7);               // shaded side
    const face = g.createLinearGradient(bx, by, bx + s * 2, by);
    face.addColorStop(0, '#e6dcc6'); face.addColorStop(1, '#f7efdc');
    g.fillStyle = face; g.fillRect(bx, by, s * 2, s * 1.9);                                                // lit front

    k.blacks.forEach(([n, after]) => { const bw = ww * 0.58; s += `<rect x="${(after + 1) * ww - bw / 2}" y="${y}" width="${bw}" height="${kh * 0.6}" rx="1" fill="${lit.includes(`${hand}:${n}`) ? color : '#1a1a1a'}"/>`; });

  const r = T.reveal, card = el('div', { className: 'paper reveal' });
  if (r.image) { const img = el('img', { alt: '' }); const urls = assetUrls(r.image); img.onerror = () => { urls.shift(); if (urls.length) img.src = urls[0]; else img.remove(); }; img.src = urls[0]; card.append(img); }
  card.append(el('h2', { textContent: r.title }), el('p', { textContent: r.text }));
  return [card];
}

let solved = !!store.get().solved, sheetFound = !!store.get().sheet;
async function openSpot(key) {
  if (key === 'lang') return switchLanguage();
  if (busy || pianoOpen || viewOpen) return;
  busy = true; tip.classList.remove('on');
  const s = SPOTS[key];
  view.focus = key;
  if (key === 'library') gsap.to(specialBook.position, { z: specialBook.position.z + 0.12, duration: 0.6, ease: 'power2.out' });
  await flyTo(s.view, s.target, 1.0);
  busy = false;
  if (key === 'door') { if (solved) showView(revealView()); else { say(T.doorLocked); flyHome(); } return; }
  if (key === 'painting') return showView(paintingView());
  if (key === 'library') {
    sheetFound = true; store.set({ sheet: true }); $('pianoSheet').hidden = false;
    return showView(sheetView(), { onClose: () => { gsap.to(specialBook.position, { z: specialBook.position.z - 0.12, duration: 0.5, ease: 'power2.inOut' }); flyHome(); } });
  }
  if (key === 'piano') openPiano();
}

/* ===================== The piano ===================== */
const pianoEl = $('piano'), noteEl = $('pianoNote');
let pianoOpen = false;
$('pianoClose').textContent = T.piano.close;
$('pianoSheet').textContent = T.piano.sheet;
$('pianoSheet').hidden = !sheetFound;
$('handR').textContent = T.piano.right; $('handL').textContent = T.piano.left;
pianoEl.setAttribute('aria-label', T.piano.name);
// Computer keys (by physical position, so English and Arabic layouts both work)
const CODES = {
  KeyQ: 'R:C4', KeyW: 'R:D4', KeyE: 'R:E4', KeyR: 'R:F4', KeyT: 'R:G4', KeyY: 'R:A4', KeyU: 'R:B4', KeyI: 'R:C5', KeyO: 'R:D5', KeyP: 'R:E5',
  Digit2: 'R:C#4', Digit3: 'R:D#4', Digit5: 'R:F#4', Digit6: 'R:G#4', Digit7: 'R:A#4', Digit9: 'R:C#5', Digit0: 'R:D#5',
  KeyA: 'L:E2', KeyS: 'L:F2', KeyD: 'L:G2', KeyF: 'L:A2', KeyG: 'L:B2', KeyH: 'L:C3', KeyJ: 'L:D3', KeyK: 'L:E3', KeyL: 'L:F3', Semicolon: 'L:G3', Quote: 'L:A3',
  BracketLeft: 'L:G#3',
};
const LETTER = Object.fromEntries(Object.entries(CODES).map(([code, id]) => [id, code.replace(/^Key|^Digit/, '').replace('Semicolon', ';').replace('Quote', "'").replace('BracketLeft', '[')]));
const keyEls = new Map();
for (const hand of ['R', 'L']) {
  const wrap = $(`keys${hand}`), k = KEYS[hand], ww = 100 / k.whites.length;
  const make = (note, cls) => {
    const id = `${hand}:${note}`;
    const b = el('button', { className: `key ${cls}`, type: 'button', tabIndex: -1 });
    b.dataset.id = id; b.setAttribute('aria-label', `${hand === 'R' ? T.piano.right : T.piano.left} ${note}`);
    if (LETTER[id]) b.append(el('span', { className: 'letter', textContent: LETTER[id] }));
    keyEls.set(id, b); return b;
  };
  k.whites.forEach(n => wrap.append(make(n, 'white')));
  k.blacks.forEach(([n, after]) => { const b = make(n, 'black'); b.style.left = `calc(${(after + 1) * ww}% - 3.1%)`; wrap.append(b); });
}

const pointerKeys = new Map(); // pointerId → key id (each finger is its own press)
function keyDown(id) {
  const b = keyEls.get(id); if (!b) return;
  b.classList.add('down');
  noteOn(id, id.slice(2));
  if (navigator.vibrate && touch) navigator.vibrate(8);
  hideCoach();
  check(id);
}
function keyUp(id) {
  const b = keyEls.get(id); if (!b) return;
  if ([...pointerKeys.values()].includes(id) || heldCodes.has(id)) return; // still held by another finger / key
  b.classList.remove('down');
  noteOff(id);
}
pianoEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('.key'); if (!b) return;
  e.preventDefault();
  getAudio();
  pointerKeys.set(e.pointerId, b.dataset.id);
  keyDown(b.dataset.id);
});
const release = e => { const id = pointerKeys.get(e.pointerId); if (!id) return; pointerKeys.delete(e.pointerId); keyUp(id); };
addEventListener('pointerup', release); addEventListener('pointercancel', release);
const heldCodes = new Set();
addEventListener('keydown', e => {
  if (!pianoOpen || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  const id = CODES[e.code]; if (!id) return;
  e.preventDefault(); getAudio();
  heldCodes.add(id); keyDown(id);
});
addEventListener('keyup', e => { const id = CODES[e.code]; if (!id || !heldCodes.has(id)) return; heldCodes.delete(id); keyUp(id); });
pianoEl.addEventListener('contextmenu', e => e.preventDefault());

let coachTimer = 0;
// After "Show answer", the piano shows the way: the keys of the current step glow
const guiding = () => answerShown && !solved;
function showGuide() {
  pianoEl.querySelectorAll('.key.guide').forEach(b => b.classList.remove('guide'));
  if (!guiding() || !pianoOpen) return;
  const step = SOL[line][idx];
  step.forEach(id => keyEls.get(id)?.classList.add('guide'));
  noteEl.textContent = fill(step.length > 1 ? T.piano.guideTogether : T.piano.guide, { l: line + 1, s: idx + 1, n: SOL[line].length });
}
const pianoHelp = () => (touch ? T.piano.coach : T.piano.mouse);
function hideCoach() { clearTimeout(coachTimer); pianoEl.querySelectorAll('.coach').forEach(c => c.classList.add('gone')); }
async function openPiano() {
  pianoOpen = true; document.body.classList.add('playing');
  getAudio();
  stopMusic(); // the background piece makes room while you play
  pianoEl.hidden = false;
  gsap.fromTo(pianoEl, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: 'power1.out' });
  gsap.from(pianoEl.querySelectorAll('.kb'), { y: 24, autoAlpha: 0, duration: 0.5, ease: 'power3.out', stagger: 0.08, delay: 0.1 });
  pianoEl.querySelectorAll('.coach').forEach(c => c.classList.remove('gone'));
  coachTimer = setTimeout(hideCoach, 4000);
noteEl.textContent = samples.size === SAMPLE_NAMES.length ? pianoHelp() : T.piano.loading;
  samplesReady.then(() => { if (pianoOpen) { noteEl.textContent = pianoHelp(); showGuide(); } });
  showGuide();
  if (touch) { try { await document.documentElement.requestFullscreen?.(); await screen.orientation?.lock?.('landscape'); } catch { /* not allowed here */ } }
}
function closePiano(backToRoom = true) {
  pianoOpen = false; document.body.classList.remove('playing');
  for (const id of keyEls.keys()) { keyEls.get(id).classList.remove('down'); noteOff(id); }
  pointerKeys.clear(); heldCodes.clear(); showGuide();
  gsap.to(pianoEl, { autoAlpha: 0, duration: 0.25, ease: 'power1.in', onComplete: () => { pianoEl.hidden = true; gsap.set(pianoEl, { clearProps: 'all' }); } });
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  if (backToRoom) flyHome();
  if (solved && backToRoom) setTimeout(startMusic, 600);
}
$('pianoClose').addEventListener('click', () => closePiano());
$('pianoSheet').addEventListener('click', () => showView(sheetView(), { onClose: () => {} }));

/* ===================== Checking the answer =====================
   Every press plays its note. A wrong key quietly restarts the current line (finished lines stay lit).
   "Together" steps accept the two keys in either order within CONFIG.pairWindow ms. */
const SOL = CONFIG.solution;
let line = 0, idx = 0, pending = null;
const linesDone = () => line;
function check(id, retry = true) {
  if (solved) return;
  const step = SOL[line][idx], now = performance.now();
  if (step.length === 1) {
    if (id === step[0]) return advance();
    return wrong(id, retry);
  }
  if (!pending || now - pending.t > CONFIG.pairWindow) {
    if (step.includes(id)) { pending = { id, t: now }; return; }
    return wrong(id, retry);
  }
  if (step.includes(id) && id !== pending.id) return advance();
  if (id === pending.id) { pending.t = now; return; }
  wrong(id, retry);
}
function wrong(id, retry) {
  const restarted = idx > 0 || pending;
  idx = 0; pending = null;
  if (restarted && retry) check(id, false); // the wrong key may itself be the first key of the line
  if (retry) showGuide();
}
function advance() {
  idx++; pending = null;
  if (idx < SOL[line].length) return showGuide();
  lightLamp(line, true);
  line++; idx = 0;
  if (line === SOL.length) solve();
  else say(fill(T.lineDone, { n: line }));
  showGuide();
}
function lightLamp(i, animate) {
  const l = lamps[i];
  $('pianoLamps').children[i].classList.add('on');
  if (animate) {
    play('lamp');
    gsap.to(l.bulb.material, { emissiveIntensity: 2.2, duration: 0.5, ease: 'power2.out' });
    gsap.to(l.glow, { intensity: 0.9, duration: 0.6, ease: 'power2.out' });
  } else { l.bulb.material.emissiveIntensity = 2.2; l.glow.intensity = 0.9; }
}
function setDoorOpen(animate) {
  const tl = gsap.timeline();
  if (animate) {
    play('latch'); play('creak', 0.35); play('thud', 2.2);
    tl.to(hinge.rotation, { y: -0.06, duration: 0.25, ease: 'power2.out' })
      .to(hinge.rotation, { y: -1.75, duration: 2.0, ease: 'power3.inOut' })
      .to(doorway, { intensity: 6, duration: 1.6, ease: 'power2.out' }, 0.3);
  } else { hinge.rotation.y = -1.75; doorway.intensity = 6; }
  return tl;
}
async function solve() {
  solved = true; store.set({ solved: true });
  say(T.solved);
  await new Promise(r => setTimeout(r, 1300));
  closePiano(false); // the camera goes to the door instead of back to the room
  await flyTo(SPOTS.door.view, SPOTS.door.target, 1.2);
  view.focus = 'door';
  await setDoorOpen(true);
  startMusic();
  showView(revealView());
}

/* ---- Sound button: the house's atmosphere and the music after solving ---- */
const musicBtn = $('musicBtn');
$('musicLabel').textContent = T.ui.sound;
musicBtn.setAttribute('aria-pressed', String(soundOn));
musicBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  store.set({ soundOff: !soundOn });
  musicBtn.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) { startAmbience(); if (solved) startMusic(); } else { stopMusic(); ambience?.stop(); }
});

/* ===================== Status line ===================== */
const status = $('status');
function say(text) {
  gsap.timeline()
    .to(status, { autoAlpha: 0, y: -4, duration: 0.15, ease: 'power1.out', overwrite: true })
    .add(() => { status.textContent = text; })
    .fromTo(status, { y: 6 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: 'power2.out' });
}

/* ===================== Hints: one at a time, then the answer ===================== */
const HU = T.ui, ORDER = CONFIG.hintOrder;
const hintList = $('hintList'), hintBtn = $('hintBtn'), answerBtn = $('answerBtn'), hintToggle = $('hintToggle');
let hintsUsed = Math.min(store.get().hints ?? 0, ORDER.length), answerShown = !!store.get().answer;
$('hints').setAttribute('aria-label', HU.show);
answerBtn.textContent = HU.showAnswer;
const VIEW_FOR = { painting: paintingView, sheet: sheetView }; // the riddle is text only
function card(tag, text, look, animate) {
  const li = el('li', { className: 'card' }, el('span', { className: 'tag', textContent: tag }), document.createTextNode(text));
  if (VIEW_FOR[look]) li.append(el('button', { className: 'look', type: 'button', textContent: HU.look, onclick: () => { if (look === 'sheet') { sheetFound = true; store.set({ sheet: true }); $('pianoSheet').hidden = false; } showView(VIEW_FOR[look](), { onClose: () => {} }); } }));
  hintList.append(li);
  if (animate) { hintList.hidden = false; gsap.from(li, { y: 14, autoAlpha: 0, duration: 0.5, ease: 'power3.out' }); li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); play('paper'); }
}
function swapButton(out, inn, animate) {
  if (!animate) { out.hidden = true; if (inn) inn.hidden = false; return; }
  gsap.to(out, { autoAlpha: 0, scale: 0.96, duration: 0.15, ease: 'power1.out', onComplete: () => {
    out.hidden = true; gsap.set(out, { clearProps: 'opacity,visibility,scale' });
    if (!inn) return;
    inn.hidden = false; gsap.from(inn, { autoAlpha: 0, scale: 0.96, duration: 0.3, ease: 'back.out(1.6)' });
  } });
}
function updateHintButtons(animate) {
  hintBtn.replaceChildren(HU.hint, el('span', { className: 'count', textContent: `${hintsUsed}/${ORDER.length}` }));
  if (hintsUsed >= ORDER.length && !hintBtn.hidden) swapButton(hintBtn, answerShown ? null : answerBtn, animate);
  if (answerShown && !answerBtn.hidden) swapButton(answerBtn, null, animate);
  hintToggle.hidden = hintsUsed === 0;
  hintToggle.textContent = hintList.hidden ? HU.show : HU.hide;
}
const addHint = (i, animate) => card(fill(HU.hintTitle, { n: i + 1, total: ORDER.length }), T.hints[ORDER[i]], ORDER[i], animate);
hintBtn.addEventListener('click', () => { if (hintsUsed >= ORDER.length) return; addHint(hintsUsed, true); hintsUsed++; store.set({ hints: hintsUsed }); updateHintButtons(true); });
answerBtn.addEventListener('click', () => {
  answerShown = true; store.set({ answer: true }); card(HU.answerTitle, T.hints.answer, 'sheet', true); updateHintButtons(true);
  if (solved) return;
  if (pianoOpen) return showGuide();
  const wait = viewOpen ? 1300 : 500; // let the close-up fly home first
  if (viewOpen) closeView();
  setTimeout(() => openSpot('piano'), wait);
});
hintToggle.addEventListener('click', () => {
  hintList.hidden = !hintList.hidden;
  if (!hintList.hidden) gsap.from(hintList.children, { y: 10, autoAlpha: 0, duration: 0.35, ease: 'power2.out', stagger: 0.04 });
  hintToggle.textContent = hintList.hidden ? HU.show : HU.hide;
});
for (let i = 0; i < hintsUsed; i++) addHint(i, false);
if (answerShown) card(HU.answerTitle, T.hints.answer, 'sheet', false);
hintList.hidden = hintsUsed === 0;
hintBtn.hidden = hintsUsed >= ORDER.length;
answerBtn.hidden = hintsUsed < ORDER.length || answerShown;
updateHintButtons(false);

/* ===================== Loop ===================== */
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const cam = { x: 0, y: 0 }, projected = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  cam.x = damp(cam.x, calm || view.focus ? 0 : mouse.x * 0.35, 2.5, dt);
  cam.y = damp(cam.y, calm || view.focus ? 0 : -mouse.y * 0.18, 2.5, dt);
  camera.position.set(view.pos.x + cam.x, view.pos.y + cam.y, view.pos.z);
  camera.lookAt(view.target);
  // The book holding the sheet breathes a soft glow
  specialBook.material.emissiveIntensity = 0.25 + 0.2 * Math.sin(now / 520);
  // The neon sign hums, and now and then stutters for a moment
  if (!neonBusy && Math.random() < 0.0005) {
    neonSign.material.opacity = 0.55; neonGlow.intensity = 0.3;
    setTimeout(() => { if (!neonBusy) { neonSign.material.opacity = 1; neonGlow.intensity = 0.6; } }, 70);
  }
  // Candle flames waver; their light breathes with them
  for (const c of candles) {
    const f = 0.85 + 0.1 * Math.sin(now / 90 + c.seed) + 0.06 * Math.sin(now / 37 + c.seed * 3);
    c.glow.intensity = 0.55 * f;
    c.flame.scale.set(1, f, 1);
    c.flame.rotation.z = 0.06 * Math.sin(now / 160 + c.seed);
  }
  // Dust floats slowly upward through the lamp light
  dust.rotation.y = Math.sin(now / 9000) * 0.05;
  dust.position.y = ((now / 40000) % 0.3);
  // Hotspot markers follow their objects on screen; hidden while looking closely or playing
  const hideAll = !!view.focus || pianoOpen || viewOpen;
  for (const s of Object.values(SPOTS)) {
    projected.copy(s.at).project(camera);
    const x = (projected.x * 0.5 + 0.5) * innerWidth, y = (-projected.y * 0.5 + 0.5) * innerHeight;
    s.el.style.transform = `translate(${x}px, ${y}px)`;
    s.el.classList.toggle('away', hideAll || projected.z > 1);
  }
  if (!pianoOpen) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ===================== Boot ===================== */
layout();
if (solved) {
  for (let i = 0; i < 4; i++) lightLamp(i, false); line = SOL.length; setDoorOpen(false);
  addEventListener('pointerdown', () => samplesReady.then(startMusic), { once: true });
}
// The house starts breathing at the first tap, click or key (browsers allow no sound before that)
for (const type of ['pointerdown', 'keydown']) addEventListener(type, () => startAmbience(), { once: true });
requestAnimationFrame(frame);
$('loader').classList.add('done');
gsap.timeline({ delay: 0.15 })
  .from(view.pos, { z: view.pos.z + 1.6, y: view.pos.y + 0.3, duration: 2.4, ease: 'expo.out' })
  .from(ceilingLamp, { intensity: 0, duration: 1.6, ease: 'power2.out' }, 0)
  .from('#label, #hints', { autoAlpha: 0, y: 8, duration: 0.6, ease: 'power2.out', stagger: 0.1 }, 0.9)
  .add(() => say(solved ? T.solved : narrow ? `${T.intro} ${T.swipe}` : T.intro), 1.2);
</script>
</body>
</html>
